<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Walletstack</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @font-face {
    font-family: 'Card';
    src: local('Arial Black');
  }

  :root {
    --bg: #121417;
    --bg-deep: #0A0C0E;
    --surface: #F5F7FA;
    --surface-dim: #E3E7ED;
    --raised: #1C1F24;
    --raised-line: rgba(255,255,255,0.08);
    --mint: #5EE6B0;
    --mint-bright: #82F0C4;
    --mint-dim: #2E5C4C;
    --coral: #FF6B6B;
    --coral-dim: #6B3636;
    --ink: #0E1012;
    --ink-soft: #9BA3AE;
    --ink-on-light: #5C6470;
    --stripe: #0E1012;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--surface);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .mono {
    font-family: 'SF Mono', 'Courier New', monospace;
    letter-spacing: 0.04em;
  }

  /* ---------- Header ---------- */
  header {
    padding: 28px 20px 14px;
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    z-index: 10;
  }

  .brand {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.02em;
    color: var(--surface);
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand .dot { color: var(--mint); }

  .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 2px 0 0;
    letter-spacing: 0.02em;
  }

  /* ---------- Filters ---------- */
  .filters {
    display: flex;
    gap: 8px;
    padding: 14px 20px 4px;
    overflow-x: auto;
  }

  .filter-btn {
    background: transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--surface);
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn.active {
    background: var(--mint);
    border-color: var(--mint);
    color: var(--ink);
  }

  .filter-count {
    color: var(--bg);
    opacity: 0.55;
    margin-left: 4px;
  }
  .filter-btn.active .filter-count { opacity: 0.6; }

  /* ---------- Summary strip ---------- */
  .summary {
    display: flex;
    gap: 20px;
    padding: 16px 20px;
    margin: 6px 20px 4px;
  }

  .summary-item {
    flex: 1;
  }

  .summary-value {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--mint-bright);
  }

  .summary-label {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* ---------- Card stack ---------- */
  .stack {
    padding: 10px 20px 100px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card-tile {
    position: relative;
    background: var(--surface);
    border-radius: 16px;
    padding: 18px 18px 16px;
    color: var(--ink);
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.08) inset;
    border: 1px solid rgba(0,0,0,0.06);
    transition: transform 0.12s ease;
  }

  .card-tile:active {
    transform: scale(0.985);
  }

  .card-tile.closed {
    opacity: 0.55;
  }

  .card-tile .stripe {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: repeating-linear-gradient(
      135deg,
      var(--stripe) 0px,
      var(--stripe) 3px,
      transparent 3px,
      transparent 7px
    );
    opacity: 0.12;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding-left: 6px;
  }

  .card-name {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }

  .card-merchants {
    font-size: 12px;
    color: var(--ink-on-light);
    margin-top: 3px;
  }

  .card-value {
    text-align: right;
    flex-shrink: 0;
  }

  .card-value .amount {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 19px;
    color: var(--ink);
  }

  .card-value.zero .amount { color: var(--coral); }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-left: 6px;
  }

  .status-pill {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 10px;
  }

  .status-pill.open {
    background: rgba(94,230,176,0.16);
    color: var(--mint);
  }

  .status-pill.closed {
    background: rgba(255,107,107,0.14);
    color: var(--coral);
  }

  .expiry {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .expiry.soon {
    color: var(--coral);
    font-weight: 600;
  }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 60px 30px;
    color: var(--ink-soft);
  }

  .empty-title {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 18px;
    color: var(--surface);
    margin-bottom: 6px;
  }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--mint);
    color: var(--ink);
    border: none;
    font-size: 28px;
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px -4px rgba(0,0,0,0.5);
    cursor: pointer;
    z-index: 20;
    padding-bottom: 2px;
  }

  .fab:active { transform: scale(0.94); }

  /* ---------- Detail overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-deep);
    z-index: 100;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.25,.8,.3,1);
    overflow-y: auto;
    padding-bottom: 60px;
  }

  .overlay.show {
    transform: translateY(0);
  }

  .overlay-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 6px;
    position: sticky;
    top: 0;
    background: var(--bg-deep);
    z-index: 5;
  }

  .icon-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--surface);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:active { background: rgba(255,255,255,0.16); }

  .overlay-actions {
    display: flex;
    gap: 8px;
  }

  /* Big "physical card" face */
  .card-face {
    margin: 16px 20px 8px;
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-dim) 100%);
    border-radius: 18px;
    padding: 24px 22px;
    color: var(--ink);
    position: relative;
    overflow: hidden;
    min-height: 170px;
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.6);
  }

  .card-face::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -20%;
    width: 70%;
    height: 180%;
    background: radial-gradient(circle, rgba(94,230,176,0.16), transparent 70%);
  }

  .card-face-name {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 21px;
    letter-spacing: -0.01em;
    position: relative;
  }

  .card-face-merchants {
    font-size: 12.5px;
    color: var(--ink-on-light);
    margin-top: 4px;
    position: relative;
  }

  .card-face-balance {
    margin-top: 26px;
    position: relative;
  }

  .card-face-balance .amount {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 34px;
    color: var(--ink);
  }

  .card-face-balance .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-on-light);
  }

  .card-chip {
    position: absolute;
    top: 24px;
    right: 22px;
    width: 38px;
    height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--mint), #3fa97f);
    opacity: 0.85;
  }

  /* Secure field rows */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin: 26px 20px 10px;
    font-weight: 700;
  }

  .secure-row {
    margin: 0 20px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .secure-row .field-meta {
    flex: 1;
  }

  .secure-row .field-label {
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  .secure-row .field-value {
    font-size: 17px;
    color: var(--surface);
    font-weight: 600;
  }

  .copy-btn {
    background: rgba(94,230,176,0.14);
    color: var(--mint-bright);
    border: none;
    border-radius: 9px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .copy-btn:active { background: rgba(94,230,176,0.24); }
  .copy-btn.copied { background: rgba(122,139,122,0.25); color: var(--mint); }

  .info-grid {
    margin: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .info-cell {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 13px 14px;
  }

  .info-cell .field-label {
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .info-cell .field-value {
    font-size: 15px;
    color: var(--surface);
    font-weight: 600;
  }

  .notes-box {
    margin: 0 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 14px;
    color: var(--surface);
    line-height: 1.5;
  }

  .danger-zone {
    margin: 30px 20px 0;
    display: flex;
    gap: 10px;
  }

  .btn-outline {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--surface);
    padding: 13px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-outline.reopen {
    border-color: var(--mint-dim);
    color: var(--mint);
  }

  .btn-outline.close-card {
    border-color: var(--coral-dim);
    color: var(--coral);
  }

  .btn-outline.delete {
    border-color: var(--coral-dim);
    color: var(--coral);
  }

  /* ---------- Edit form ---------- */
  .form-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-deep);
    z-index: 200;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.25,.8,.3,1);
    overflow-y: auto;
    padding-bottom: 60px;
  }

  .form-screen.show { transform: translateY(0); }

  .form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    background: var(--bg-deep);
    z-index: 5;
  }

  .form-title {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 17px;
    color: var(--surface);
  }

  .save-btn {
    background: var(--mint);
    color: var(--ink);
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .form-body {
    padding: 6px 20px 20px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .field input, .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 11px;
    color: var(--surface);
    padding: 13px 14px;
    font-size: 16px;
    font-family: inherit;
  }

  .field input.mono, .field textarea.mono {
    font-family: 'SF Mono', 'Courier New', monospace;
    letter-spacing: 0.05em;
  }

  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--mint);
  }

  .field-row {
    display: flex;
    gap: 12px;
  }

  .field-row .field { flex: 1; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .toggle-row .label-text {
    font-size: 14px;
    color: var(--surface);
    font-weight: 600;
  }

  .switch {
    position: relative;
    width: 48px;
    height: 28px;
    flex-shrink: 0;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .switch-track {
    position: absolute;
    inset: 0;
    background: var(--ink-soft);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .switch-track::before {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: var(--surface);
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .switch input:checked + .switch-track {
    background: var(--coral-dim);
  }

  .switch input:checked + .switch-track::before {
    transform: translateX(20px);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    color: var(--ink);
    padding: 11px 20px;
    border-radius: 24px;
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: 0 8px 24px -6px rgba(0,0,0,0.5);
    z-index: 300;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  ::selection { background: var(--mint); color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1 class="brand">Walletstack<span class="dot">.</span></h1>
  <p class="subtitle" id="subtitleText">Your gift cards, all in one place</p>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">All <span class="filter-count" id="countAll">0</span></button>
  <button class="filter-btn" data-filter="open">Open <span class="filter-count" id="countOpen">0</span></button>
  <button class="filter-btn" data-filter="closed">Closed <span class="filter-count" id="countClosed">0</span></button>
</div>

<div class="summary" id="summaryBar">
  <div class="summary-item">
    <div class="summary-value" id="summaryTotal">$0</div>
    <div class="summary-label">Available</div>
  </div>
  <div class="summary-item">
    <div class="summary-value" id="summaryActive">0</div>
    <div class="summary-label">Open cards</div>
  </div>
</div>

<div class="stack" id="stack"></div>

<button class="fab" id="addFab">+</button>

<!-- Detail overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-header">
    <button class="icon-btn" id="closeOverlay">‹</button>
    <div class="overlay-actions">
      <button class="icon-btn" id="editFromOverlay">✎</button>
    </div>
  </div>

  <div class="card-face" id="cardFace">
    <div class="card-chip"></div>
    <div class="card-face-name" id="faceName">—</div>
    <div class="card-face-merchants" id="faceMerchants">—</div>
    <div class="card-face-balance">
      <div class="amount" id="faceBalance">$0.00</div>
      <div class="label">Remaining balance</div>
    </div>
  </div>

  <div class="section-label">Card details</div>
  <div class="secure-row">
    <div class="field-meta">
      <div class="field-label">Card number</div>
      <div class="field-value mono" id="detailCardNumber">—</div>
    </div>
    <button class="copy-btn" data-copy-target="detailCardNumber">Copy</button>
  </div>
  <div class="secure-row">
    <div class="field-meta">
      <div class="field-label">PIN</div>
      <div class="field-value mono" id="detailPin">—</div>
    </div>
    <button class="copy-btn" data-copy-target="detailPin">Copy</button>
  </div>

  <div class="section-label">At a glance</div>
  <div class="info-grid">
    <div class="info-cell">
      <div class="field-label">Status</div>
      <div class="field-value" id="detailStatus">—</div>
    </div>
    <div class="info-cell">
      <div class="field-label">Expires</div>
      <div class="field-value" id="detailExpiry">—</div>
    </div>
  </div>

  <div class="section-label" id="notesLabel" style="display:none;">Notes</div>
  <div class="notes-box" id="notesBox" style="display:none;"></div>

  <div class="danger-zone">
    <button class="btn-outline reopen" id="reopenBtn" style="display:none;">Reopen card</button>
    <button class="btn-outline close-card" id="closeCardBtn">Mark as closed</button>
  </div>
  <div class="danger-zone">
    <button class="btn-outline delete" id="deleteBtn">Delete card</button>
  </div>
</div>

<!-- Add/Edit form -->
<div class="form-screen" id="formScreen">
  <div class="form-header">
    <button class="icon-btn" id="closeForm">‹</button>
    <div class="form-title" id="formTitle">Add a card</div>
    <button class="save-btn" id="saveBtn">Save</button>
  </div>
  <div class="form-body">
    <div class="field">
      <label for="f_name">Card name</label>
      <input type="text" id="f_name" placeholder="e.g. Coles &amp; Myer voucher">
    </div>
    <div class="field">
      <label for="f_merchants">Merchant(s) supported</label>
      <input type="text" id="f_merchants" placeholder="e.g. Coles, Myer, Kmart">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f_balance">Remaining value ($)</label>
        <input type="text" inputmode="decimal" id="f_balance" placeholder="0.00">
      </div>
      <div class="field">
        <label for="f_expiry">Expiry date</label>
        <input type="date" id="f_expiry">
      </div>
    </div>
    <div class="field">
      <label for="f_number">Card number</label>
      <input type="text" inputmode="numeric" class="mono" id="f_number" placeholder="0000 0000 0000 0000">
    </div>
    <div class="field">
      <label for="f_pin">PIN</label>
      <input type="text" inputmode="numeric" class="mono" id="f_pin" placeholder="0000">
    </div>
    <div class="field">
      <label for="f_notes">Notes (optional)</label>
      <textarea id="f_notes" rows="3" placeholder="Anything else worth remembering"></textarea>
    </div>
    <div class="toggle-row">
      <span class="label-text">Card is closed / used up</span>
      <label class="switch">
        <input type="checkbox" id="f_closed">
        <span class="switch-track"></span>
      </label>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'walletstack_cards_v1';
  let cards = [];
  let currentFilter = 'all';
  let activeCardId = null;
  let editingCardId = null;

  function uid() {
    return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      cards = raw ? JSON.parse(raw) : [];
    } catch (e) {
      cards = [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  }

  function fmtMoney(n) {
    const num = parseFloat(n) || 0;
    return '$' + num.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtMoneyShort(n) {
    const num = parseFloat(n) || 0;
    if (num % 1 === 0) return '$' + num.toLocaleString('en-AU');
    return '$' + num.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtDate(iso) {
    if (!iso) return 'No expiry';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function daysUntil(iso) {
    if (!iso) return Infinity;
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(iso + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function isExpiringSoon(iso) {
    const d = daysUntil(iso);
    return d !== Infinity && d <= 30 && d >= 0;
  }

  function isExpired(iso) {
    const d = daysUntil(iso);
    return d !== Infinity && d < 0;
  }

  function renderCounts() {
    const open = cards.filter(c => !c.closed).length;
    const closed = cards.filter(c => c.closed).length;
    document.getElementById('countAll').textContent = cards.length;
    document.getElementById('countOpen').textContent = open;
    document.getElementById('countClosed').textContent = closed;
  }

  function renderSummary() {
    const openCards = cards.filter(c => !c.closed);
    const total = openCards.reduce((sum, c) => sum + (parseFloat(c.balance) || 0), 0);
    document.getElementById('summaryTotal').textContent = fmtMoneyShort(total);
    document.getElementById('summaryActive').textContent = openCards.length;
  }

  function renderStack() {
    const stack = document.getElementById('stack');
    let filtered = cards;
    if (currentFilter === 'open') filtered = cards.filter(c => !c.closed);
    if (currentFilter === 'closed') filtered = cards.filter(c => c.closed);

    filtered = filtered.slice().sort((a, b) => {
      if (a.closed !== b.closed) return a.closed ? 1 : -1;
      const da = a.expiry ? new Date(a.expiry) : new Date('2999-12-31');
      const db = b.expiry ? new Date(b.expiry) : new Date('2999-12-31');
      return da - db;
    });

    if (filtered.length === 0) {
      const msg = currentFilter === 'closed'
        ? { title: 'No closed cards', body: 'Cards you mark as closed will show up here.' }
        : currentFilter === 'open'
        ? { title: 'No open cards', body: 'Add a card to start tracking it.' }
        : { title: 'No gift cards yet', body: 'Tap the + button to add your first one.' };
      stack.innerHTML = `<div class="empty"><div class="empty-title">${msg.title}</div><div>${msg.body}</div></div>`;
      return;
    }

    stack.innerHTML = filtered.map(c => {
      const expSoon = isExpiringSoon(c.expiry);
      const expired = isExpired(c.expiry);
      const balance = parseFloat(c.balance) || 0;
      const merchants = c.merchants || '';
      let expiryLabel = fmtDate(c.expiry);
      if (expired && !c.closed) expiryLabel = 'Expired';
      else if (expSoon) expiryLabel = `Expires in ${daysUntil(c.expiry)}d`;

      return `
        <div class="card-tile ${c.closed ? 'closed' : ''}" data-id="${c.id}">
          <div class="stripe"></div>
          <div class="card-top">
            <div>
              <div class="card-name">${escapeHtml(c.name || 'Untitled card')}</div>
              <div class="card-merchants">${escapeHtml(merchants) || 'No merchant set'}</div>
            </div>
            <div class="card-value ${balance <= 0 ? 'zero' : ''}">
              <div class="amount">${fmtMoney(balance)}</div>
            </div>
          </div>
          <div class="card-bottom">
            <span class="status-pill ${c.closed ? 'closed' : 'open'}">${c.closed ? 'Closed' : 'Open'}</span>
            <span class="expiry ${expSoon || expired ? 'soon' : ''}">${expiryLabel}</span>
          </div>
        </div>
      `;
    }).join('');

    stack.querySelectorAll('.card-tile').forEach(el => {
      el.addEventListener('click', () => openDetail(el.dataset.id));
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderAll() {
    renderCounts();
    renderSummary();
    renderStack();
  }

  // ---------- Detail overlay ----------
  function openDetail(id) {
    const c = cards.find(x => x.id === id);
    if (!c) return;
    activeCardId = id;

    document.getElementById('faceName').textContent = c.name || 'Untitled card';
    document.getElementById('faceMerchants').textContent = c.merchants || 'No merchant set';
    document.getElementById('faceBalance').textContent = fmtMoney(c.balance);
    document.getElementById('detailCardNumber').textContent = c.number || '—';
    document.getElementById('detailPin').textContent = c.pin || '—';
    document.getElementById('detailStatus').textContent = c.closed ? 'Closed' : 'Open';
    document.getElementById('detailExpiry').textContent = fmtDate(c.expiry);

    const notesBox = document.getElementById('notesBox');
    const notesLabel = document.getElementById('notesLabel');
    if (c.notes && c.notes.trim()) {
      notesBox.textContent = c.notes;
      notesBox.style.display = 'block';
      notesLabel.style.display = 'block';
    } else {
      notesBox.style.display = 'none';
      notesLabel.style.display = 'none';
    }

    document.getElementById('reopenBtn').style.display = c.closed ? 'block' : 'none';
    document.getElementById('closeCardBtn').style.display = c.closed ? 'none' : 'block';

    document.getElementById('overlay').classList.add('show');
  }

  function closeDetail() {
    document.getElementById('overlay').classList.remove('show');
    activeCardId = null;
  }

  // ---------- Copy ----------
  function copyToClipboard(text, btn) {
    const doFallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(doFallback);
    } else {
      doFallback();
    }

    const originalText = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = originalText;
      btn.classList.remove('copied');
    }, 1300);
  }

  // ---------- Form (add/edit) ----------
  function openForm(id) {
    editingCardId = id || null;
    const c = id ? cards.find(x => x.id === id) : null;

    document.getElementById('formTitle').textContent = c ? 'Edit card' : 'Add a card';
    document.getElementById('f_name').value = c ? c.name || '' : '';
    document.getElementById('f_merchants').value = c ? c.merchants || '' : '';
    document.getElementById('f_balance').value = c ? c.balance || '' : '';
    document.getElementById('f_expiry').value = c ? c.expiry || '' : '';
    document.getElementById('f_number').value = c ? c.number || '' : '';
    document.getElementById('f_pin').value = c ? c.pin || '' : '';
    document.getElementById('f_notes').value = c ? c.notes || '' : '';
    document.getElementById('f_closed').checked = c ? !!c.closed : false;

    document.getElementById('formScreen').classList.add('show');
  }

  function closeForm() {
    document.getElementById('formScreen').classList.remove('show');
    editingCardId = null;
  }

  function saveForm() {
    const name = document.getElementById('f_name').value.trim();
    if (!name) {
      showToast('Give the card a name first');
      document.getElementById('f_name').focus();
      return;
    }

    const data = {
      name,
      merchants: document.getElementById('f_merchants').value.trim(),
      balance: parseFloat(document.getElementById('f_balance').value) || 0,
      expiry: document.getElementById('f_expiry').value || '',
      number: document.getElementById('f_number').value.trim(),
      pin: document.getElementById('f_pin').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
      closed: document.getElementById('f_closed').checked
    };

    if (editingCardId) {
      const idx = cards.findIndex(x => x.id === editingCardId);
      if (idx > -1) cards[idx] = { ...cards[idx], ...data };
      showToast('Card updated');
    } else {
      cards.push({ id: uid(), ...data, createdAt: Date.now() });
      showToast('Card added');
    }

    save();
    renderAll();
    closeForm();

    if (activeCardId) {
      const stillExists = cards.find(x => x.id === activeCardId);
      if (stillExists) openDetail(activeCardId);
      else closeDetail();
    }
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Event wiring ----------
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderStack();
    });
  });

  document.getElementById('addFab').addEventListener('click', () => openForm(null));
  document.getElementById('closeForm').addEventListener('click', closeForm);
  document.getElementById('saveBtn').addEventListener('click', saveForm);

  document.getElementById('closeOverlay').addEventListener('click', closeDetail);
  document.getElementById('editFromOverlay').addEventListener('click', () => {
    if (activeCardId) openForm(activeCardId);
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.copyTarget;
      const text = document.getElementById(targetId).textContent;
      if (text && text !== '—') copyToClipboard(text, btn);
    });
  });

  document.getElementById('closeCardBtn').addEventListener('click', () => {
    if (!activeCardId) return;
    const c = cards.find(x => x.id === activeCardId);
    if (c) {
      c.closed = true;
      save();
      renderAll();
      openDetail(activeCardId);
      showToast('Card marked as closed');
    }
  });

  document.getElementById('reopenBtn').addEventListener('click', () => {
    if (!activeCardId) return;
    const c = cards.find(x => x.id === activeCardId);
    if (c) {
      c.closed = false;
      save();
      renderAll();
      openDetail(activeCardId);
      showToast('Card reopened');
    }
  });

  document.getElementById('deleteBtn').addEventListener('click', () => {
    if (!activeCardId) return;
    const c = cards.find(x => x.id === activeCardId);
    if (!c) return;
    if (confirm(`Delete "${c.name}"? This can't be undone.`)) {
      cards = cards.filter(x => x.id !== activeCardId);
      save();
      renderAll();
      closeDetail();
      showToast('Card deleted');
    }
  });

  // Init
  load();
  renderAll();

  // PWA install support (no service worker, per no-cache update strategy)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
})();
</script>
</body>
</html>
